        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;700&display=swap');
       :root{--primary:#2878D0;--primary-dark:#1f62af;--sky:#DFF2FF;--sky-2:#EAF6FF;--bg:#F7FBFF;--white:#FFFFFF;--text:#172033;--muted:#6B7A90;--line:#E6EEF9;--green:#0FA66B;--red:#E5465D;--orange:#FF8A2E;--shadow:0 10px 30px rgba(23,32,51,0.07);--shadow-soft:0 4px 16px rgba(40,120,208,0.10);--radius:18px;--radius-lg:22px;}
       *{box-sizing:border-box;font-family:'Outfit',system-ui,-apple-system,sans-serif;}
       .aivaro-root{min-height:100vh;background:var(--bg);color:var(--text);display:flex;justify-content:center;padding: env(safe-area-inset-top) 0 0 0;}
       .phone-frame{width:100%;max-width:440px;background:var(--bg);min-height:100vh;position:relative;display:flex;flex-direction:column;box-shadow:0 0 0 1px var(--line), 0 20px 80px rgba(23,32,51,0.08);overflow-x:clip;}
       @media(min-width:441px){.phone-frame{border-radius:28px;margin:12px 0;min-height:calc(100vh - 24px);overflow:hidden;}}
        .top-header{position:sticky;top:0;z-index:30;background:rgba(247,251,255,0.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);padding:12px 14px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid rgba(230,238,249,0.85);}
        .top-row{width:100%;display:flex;align-items:center;justify-content:space-between;}
        .logo{display:flex;align-items:center;gap:10px;cursor:pointer;}
        .logo-bag{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#2878D0 0%,#5BA6F0 55%,#DFF2FF 100%);display:grid;place-items:center;box-shadow:0 6px 16px rgba(40,120,208,0.28);position:relative;}
        .logo-bag::after{content:'';position:absolute;inset:0;border-radius:12px;background:linear-gradient(180deg,rgba(255,255,255,0.4),transparent);}
        .logo-bag span{color:white;font-weight:800;font-size:20px;letter-spacing:-1px;position:relative;z-index:1;font-family:'Plus Jakarta Sans',sans-serif;}
        .logo-text{line-height:1;}
        .logo-text b{font-size:17px;font-weight:700;letter-spacing:-0.3px;font-family:'Plus Jakarta Sans',sans-serif;}
        .logo-text i{font-style:normal;font-size:11px;color:var(--muted);display:block;margin-top:1px;letter-spacing:0.3px;}
        .header-actions{display:flex;gap:10px;align-items:center;}
        .icon-btn{width:40px;height:40px;border-radius:13px;background:var(--white);border:1px solid var(--line);display:grid;place-items:center;cursor:pointer;position:relative;transition:transform .15s,box-shadow .2s;box-shadow:0 2px 10px rgba(23,32,51,0.04);}
        .icon-btn:active{transform:scale(0.92);}
        .badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 5px;background:#FF3B3B;color:white;font-size:11px;font-weight:700;border-radius:20px;display:grid;place-items:center;border:2px solid var(--bg);}
        .badge.bounce{animation:bounce 0.6s cubic-bezier(0.175,0.885,0.32,1.275);}
        @keyframes bounce{0%{transform:scale(1);}30%{transform:scale(1.35);}60%{transform:scale(0.9);}100%{transform:scale(1);}}
        /* New header search */
        .header-search-wrap{position:relative;width:100%;}
        .header-search{width:100%;height:46px;background:white;border:1.5px solid var(--line);border-radius:14px;display:flex;align-items:center;gap:10px;padding:0 12px;box-shadow:0 2px 12px rgba(23,32,51,0.05);transition:border .2s,box-shadow .2s;}
        .header-search.focused{border-color:#2878D0;box-shadow:0 4px 18px rgba(40,120,208,0.15);}
        .header-search input{flex:1;border:none;outline:none;font-size:13.5px;background:transparent;color:var(--text);}
        .header-search input::placeholder{color:var(--muted);}
        .search-dropdown{position:absolute;top:calc(100% + 8px);left:0;right:0;background:rgba(255,255,255,0.96);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(230,238,249,0.9);border-radius:16px;box-shadow:0 12px 32px rgba(23,32,51,0.12),0 0 0 1px rgba(255,255,255,0.6) inset;overflow:hidden;z-index:50;animation:dropIn .28s cubic-bezier(0.22,1,0.36,1);}
        @keyframes dropIn{from{opacity:0;transform:translateY(-8px) scale(0.98);}to{opacity:1;transform:translateY(0) scale(1);}}
        .suggest-item{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;transition:background .15s;}
        .suggest-item:hover{background:#F0F7FF;}
        .suggest-thumb{width:40px;height:40px;border-radius:10px;object-fit:cover;background:#EAF6FF;flex-shrink:0;border:1px solid var(--line);}
        .suggest-info{flex:1;min-width:0;}
        .suggest-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2;}
        .suggest-cat{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-top:2px;}
        .suggest-price{font-size:13px;font-weight:800;color:var(--text);flex-shrink:0;}
        .suggest-go{width:28px;height:28px;border-radius:8px;background:#EBF4FF;display:grid;place-items:center;font-size:12px;color:var(--primary);flex-shrink:0;}
        .content{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;padding-bottom:84px;}
        .page{min-height:100%;padding:0 0 20px;animation:slideIn .38s cubic-bezier(0.22,1,0.36,1);}
        @keyframes slideIn{from{transform:translateX(28px);opacity:0;}to{transform:translateX(0);opacity:1;}}
        .page-inner{padding:14px 16px;}
        .hero-wrap{padding:12px 16px 0;}
        .hero-card{border-radius:var(--radius-lg);overflow:hidden;position:relative;height:168px;background:linear-gradient(105deg,#2878D0 0%,#6AB0F3 55%,#DFF2FF 100%);box-shadow:var(--shadow-soft);cursor:pointer;}
        .hero-bg{position:absolute;inset:0;opacity:0.22;}
        .hero-bg img{width:100%;height:100%;object-fit:cover;}
        .hero-content{position:relative;z-index:1;padding:18px 18px 16px;height:100%;display:flex;flex-direction:column;justify-content:space-between;color:white;}
        .hero-top{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;opacity:0.9;font-weight:600;background:rgba(255,255,255,0.18);display:inline-block;padding:4px 10px;border-radius:20px;backdrop-filter:blur(6px);align-self:flex-start;}
        .hero-title{font-size:26px;font-weight:800;line-height:0.95;letter-spacing:-0.8px;font-family:'Plus Jakarta Sans',sans-serif;margin-top:10px;text-shadow:0 2px 12px rgba(0,0,0,0.12);}
        .hero-sub{font-size:13px;opacity:0.92;margin-top:6px;font-weight:500;}
        .hero-cta{margin-top:12px;background:var(--white);color:var(--primary);font-weight:700;font-size:13px;padding:9px 14px;border-radius:11px;display:inline-block;box-shadow:0 4px 14px rgba(0,0,0,0.14);}
        .hero-dots{position:absolute;bottom:12px;right:16px;display:flex;gap:6px;z-index:2;}
        .dot{width:18px;height:6px;border-radius:20px;background:rgba(255,255,255,0.45);transition:all .3s;}
        .dot.active{width:22px;background:white;}
        .search-box{margin:14px 16px;background:var(--white);border:1px solid var(--line);border-radius:16px;display:flex;align-items:center;padding:0 14px;height:48px;gap:10px;box-shadow:0 2px 12px rgba(23,32,51,0.04);}
        .search-box input{flex:1;border:none;outline:none;font-size:14px;background:transparent;color:var(--text);}
        .search-box input::placeholder{color:var(--muted);}
        .section-head{display:flex;justify-content:space-between;align-items:center;margin:18px 16px 10px;}
        .section-head h3{font-size:16px;font-weight:700;letter-spacing:-0.3px;margin:0;}
        .section-head button{font-size:13px;color:var(--primary);background:none;border:none;font-weight:600;cursor:pointer;}
        .cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:0 16px;}
        .cat-card{background:var(--white);border-radius:18px;padding:12px 8px 10px;text-align:center;border:1px solid var(--line);cursor:pointer;transition:transform .18s,box-shadow .2s;box-shadow:0 2px 10px rgba(23,32,51,0.03);}
        .cat-card:active{transform:scale(0.96);}
        .cat-card:hover{transform:translateY(-3px);box-shadow:var(--shadow);}
        .cat-icon{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;margin:0 auto 7px;font-size:22px;}
        .cat-card span{font-size:11px;font-weight:600;letter-spacing:0.1px;}
        .product-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px;}
        .p-card{background:var(--white);border-radius:var(--radius);border:1px solid var(--line);overflow:hidden;cursor:pointer;transition:transform .2s,box-shadow .2s;position:relative;box-shadow:0 2px 12px rgba(23,32,51,0.04);}
        .p-card:hover{transform:translateY(-4px);box-shadow:var(--shadow);}
        .p-card:active{transform:scale(0.98);}
        .p-img{height:128px;background:var(--sky-2);position:relative;overflow:hidden;}
        .p-img img{width:100%;height:100%;object-fit:cover;}
        .p-img-fallback{width:100%;height:100%;display:grid;place-items:center;background:linear-gradient(135deg,var(--sky),#fff);font-size:34px;}
        .p-badge{position:absolute;top:8px;left:8px;background:var(--text);color:white;font-size:10px;font-weight:700;padding:4px 8px;border-radius:20px;letter-spacing:0.3px;}
        .p-badge.green{background:var(--green);}
        .p-heart{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:10px;background:rgba(255,255,255,0.92);display:grid;place-items:center;backdrop-filter:blur(8px);border:1px solid rgba(230,238,249,0.8);cursor:pointer;}
        .p-info{padding:10px 11px 11px;}
        .p-brand{font-size:10px;letter-spacing:0.8px;text-transform:uppercase;color:var(--muted);font-weight:700;}
        .p-name{font-size:13px;font-weight:600;line-height:1.25;margin:3px 0 6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:32px;}
        .p-price-row{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;}
        .p-price{font-size:15px;font-weight:800;letter-spacing:-0.3px;}
        .p-mrp{font-size:11px;color:var(--muted);text-decoration:line-through;}
        .p-off{font-size:11px;color:var(--green);font-weight:700;background:#E6F9F0;padding:2px 6px;border-radius:6px;}
        .p-del{font-size:10px;color:var(--muted);margin-top:5px;}
        .pd-header{position:sticky;top:0;z-index:10;background:var(--bg);padding:10px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);}
        .back-btn{width:38px;height:38px;border-radius:12px;background:var(--white);border:1px solid var(--line);display:grid;place-items:center;cursor:pointer;}
        .pd-gallery{position:relative;background:white;}
        .pd-main-img{height:340px;background:var(--sky-2);position:relative;overflow:hidden;}
        .pd-main-img img{width:100%;height:100%;object-fit:cover;transition:transform .4s;}
        .pd-dots{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:6px;background:rgba(23,32,51,0.12);padding:6px 10px;border-radius:20px;backdrop-filter:blur(8px);}
        .pd-dot{width:6px;height:6px;border-radius:20px;background:rgba(255,255,255,0.6);transition:all .25s;}
        .pd-dot.active{width:18px;background:white;}
        .pd-body{padding:16px;background:var(--white);border-radius:22px 22px 0 0;margin-top:-18px;position:relative;z-index:2;box-shadow:0 -10px 30px rgba(23,32,51,0.06);}
        .pd-brand{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:700;}
        .pd-name{font-size:22px;font-weight:800;line-height:1.15;letter-spacing:-0.5px;margin:6px 0 8px;font-family:'Plus Jakarta Sans',sans-serif;}
        .stars{font-size:13px;display:flex;align-items:center;gap:4px;}
        .stars .rating-text{margin-left:6px;color:var(--muted);font-size:12px;font-weight:500;}
        .variant-title{font-size:13px;font-weight:700;margin:18px 0 10px;letter-spacing:-0.2px;}
        .variant-list{display:flex;flex-direction:column;gap:10px;}
        .variant-card{border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;background:var(--white);transition:all .18s;}
        .variant-card.active{border-color:var(--primary);background:#F0F7FF;box-shadow:0 4px 14px rgba(40,120,208,0.12);}
        .variant-card .left{line-height:1.2;}
        .variant-card .left b{font-size:13px;display:block;}
        .variant-card .left span{font-size:11px;color:var(--muted);}
        .variant-card .right{text-align:right;}
        .variant-card .right b{font-size:14px;font-weight:800;display:block;}
        .variant-card .right .mrp-line{font-size:11px;color:var(--muted);text-decoration:line-through;}
        .variant-card .right .save{font-size:10px;color:var(--green);font-weight:700;background:#E6F9F0;padding:2px 6px;border-radius:6px;margin-top:3px;display:inline-block;}
        .stock-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px;}
        .price-box{margin-top:18px;background:var(--bg);border:1px dashed #C4D8F0;border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;}
        .price-box .big{font-size:22px;font-weight:800;letter-spacing:-0.5px;}
        .price-box .meta{font-size:11px;color:var(--muted);margin-top:2px;}
        .qty-row{display:flex;align-items:center;gap:12px;margin-top:16px;}
        .qty-ctrl{display:flex;align-items:center;background:var(--white);border:1px solid var(--line);border-radius:12px;overflow:hidden;}
        .qty-ctrl button{width:38px;height:38px;border:none;background:transparent;font-size:18px;cursor:pointer;display:grid;place-items:center;}
        .qty-ctrl span{width:36px;text-align:center;font-weight:700;font-size:14px;}
        .action-row{display:grid;grid-template-columns:1fr 1.2fr;gap:10px;margin-top:16px;}
        .btn{height:48px;border-radius:14px;font-size:14px;font-weight:700;cursor:pointer;border:none;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s,box-shadow .2s,background .2s;}
        .btn:active{transform:scale(0.97);}
        .btn-outline{background:var(--white);border:1.5px solid var(--text);color:var(--text);}
        .btn-primary{background:var(--primary);color:white;box-shadow:0 8px 20px rgba(40,120,208,0.28);}
        .btn-primary:hover{background:var(--primary-dark);}
        .collapsible{margin-top:16px;border-top:1px solid var(--line);padding-top:0;}
        .coll-head{padding:14px 0;display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-weight:600;font-size:14px;}
        .coll-body{padding:0 0 14px;font-size:13px;line-height:1.6;color:#3A4A64;}
        .spec-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line);font-size:12px;}
        .spec-row b{color:var(--muted);font-weight:500;}
        .cart-item{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;gap:12px;margin-bottom:10px;box-shadow:0 2px 12px rgba(23,32,51,0.04);}
        .cart-item img{width:72px;height:72px;border-radius:12px;object-fit:cover;background:var(--sky-2);}
        .cart-summary{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:12px;}
        .sum-row{display:flex;justify-content:space-between;padding:6px 0;font-size:13px;}
        .sum-row.total{font-weight:800;font-size:15px;border-top:1px dashed var(--line);margin-top:6px;padding-top:10px;}
        .order-card{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;cursor:pointer;transition:transform .18s,box-shadow .2s;}
        .order-card:hover{transform:translateY(-2px);box-shadow:var(--shadow);}
        .order-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
        .status-pill{font-size:11px;font-weight:700;padding:5px 10px;border-radius:20px;letter-spacing:0.3px;}
        .status-Ordered{background:#FFF3CD;color:#8A6D00;}
        .status-Packed{background:#DFF2FF;color:#1A5DA6;}
        .status-Shipped{background:#E8E0FF;color:#5A3BC0;}
        .status-Delivered{background:#E6F9F0;color:#0A7A4A;}
        .timeline{position:relative;padding-left:28px;}
        .timeline::before{content:'';position:absolute;left:7px;top:8px;bottom:8px;width:2px;background:var(--line);}
        .t-step{position:relative;padding:0 0 22px;display:flex;gap:12px;}
        .t-dot{position:absolute;left:-28px;top:2px;width:16px;height:16px;border-radius:50%;border:3px solid var(--white);box-shadow:0 0 0 2px var(--line);background:var(--white);}
        .t-step.done .t-dot{background:var(--green);box-shadow:0 0 0 2px var(--green);}

        .bottom-nav{position:absolute;bottom:0;left:0;right:0;height:74px;background:rgba(255,255,255,0.94);backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:30;}

        .nav-icon{font-size:20px;line-height:1;}

        @keyframes toastIn{from{transform:translate(-50%,16px);opacity:0;}to{transform:translate(-50%,0);opacity:1;}}
        .ai-fab{position:absolute;bottom:88px;right:14px;width:56px;height:56px;border-radius:18px;background:linear-gradient(135deg,#2878D0,#42D9E8);display:grid;place-items:center;color:white;font-size:24px;cursor:pointer;box-shadow:0 12px 28px rgba(40,120,208,0.38);z-index:25;transition:transform .15s;}

        .ai-msg-wrap{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px;}
        .ai-msg{max-width:82%;padding:10px 12px;border-radius:16px;font-size:13px;line-height:1.45;}
